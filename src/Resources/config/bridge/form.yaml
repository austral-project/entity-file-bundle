services:

  ##### Listener
  Austral\EntityFileBundle\Bridge\Form\Listener\UploadFormListener:
    arguments:
      $fileUploader:  '@austral.entity_file.uploader'
      $mapping:       '@austral.entity.mapping'
    tags:
      - { name: kernel.event_listener, event: "austral.form.configure_after", method: configure }
      - { name: kernel.event_listener, event: "austral.form.field.build", method: buildField }
      - { name: kernel.event_listener, event: "austral.form.submit", method: validate }
      - { name: kernel.event_listener, event: "austral.form.save_before", method: uploads }

  austral.entity_file.bridge.form.upload.listener:
    alias:  Austral\EntityFileBundle\Bridge\Form\Listener\UploadFormListener

  ##### Form type extension: description of the uploaded file
  Austral\EntityFileBundle\Bridge\Form\Extension\UploadFileTypeExtension:
    arguments:
      $mapping:           '@austral.entity.mapping'
      $fileLinkGenerator: '@austral.entity_file.link.generator'
    tags:
      - { name: form.type_extension }
