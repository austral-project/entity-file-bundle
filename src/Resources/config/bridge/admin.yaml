# Services of the bridge with admin-bundle, loaded only when AustralAdminBundle is enabled (AustralEntityFileExtension).
services:

  ##### Listener: category "uploads" of the configuration page
  Austral\EntityFileBundle\Bridge\Admin\Listener\ConfigurationCheckListener:
    arguments:
      $mapping:               '@austral.entity.mapping'
      $uploadsConfiguration:  '@austral.entity_file.uploads.config'
    tags:
      - { name: kernel.event_listener, event: austral.admin.configuration_check, method: configurationCheck }
