services:

  Austral\EntityFileBundle\Controller\FileController:
    arguments:
      $imageRender: '@austral.entity_file.image.render'
      $fileDownloader: '@austral.entity_file.downloader'
    tags: [ controller.service_arguments ]

##### Listener #####

  Austral\EntityFileBundle\Listener\DoctrineListener:
    arguments:
      $mapping:         '@austral.entity.mapping'
      $fileUploader:    '@austral.entity_file.uploader'
    tags:
      - { name: doctrine.event_listener, event: preRemove }

  Austral\EntityFileBundle\Listener\EntityMappingListener:
    arguments:
      $parameterBag:              '@parameter_bag'
      $uploadsConfiguration:      '@austral.entity_file.uploads.config'
      $cropperConfiguration:      '@austral.entity_file.cropper.config'
      $imageSizeConfiguration:    '@austral.entity_file.image_size.config'
    tags:
      - { name: kernel.event_listener, event: 'austral.event.entity.initialise.mapping', method: mapping }

  Austral\EntityFileBundle\Listener\EntityManagerListener:
    arguments:
      $mapping:         '@austral.entity.mapping'
      $fileUploader:    '@austral.entity_file.uploader'
    tags:
      - { name: kernel.event_listener, event: 'austral.entity_manager.duplicate', method: duplicate }
      - { name: kernel.event_listener, event: 'austral.entity_manager.push.after', method: copyFile }


##### Parameters
  Austral\EntityFileBundle\Configuration\UploadsConfiguration:
    arguments:
      $config:                '%austral_entity_file.uploads%'
      $cropperConfiguration:  '@austral.entity_file.cropper.config'

  austral.entity_file.uploads.config:
    alias:    Austral\EntityFileBundle\Configuration\UploadsConfiguration
    public:   true

  Austral\EntityFileBundle\Configuration\CropperConfiguration:
    arguments:
      $config:    '%austral_entity_file.cropper%'

  austral.entity_file.cropper.config:
    alias:    Austral\EntityFileBundle\Configuration\CropperConfiguration
    public:   true

  Austral\EntityFileBundle\Configuration\ImageSizeConfiguration:
    arguments:
      $config:    '%austral_entity_file.image_size%'

  austral.entity_file.image_size.config:
    alias:    Austral\EntityFileBundle\Configuration\ImageSizeConfiguration
    public:   true

  Austral\EntityFileBundle\Configuration\CompressionConfiguration:
    arguments:
      $config:    '%austral_entity_file.compression%'

  austral.entity_file.compression.config:
    alias:    Austral\EntityFileBundle\Configuration\CompressionConfiguration
    public:   true

##### File
  Austral\EntityFileBundle\File\Upload\FileUploader:
    arguments:
      $mapping:               '@austral.entity.mapping'
      $cropper:               '@austral.entity_file.cropper'
      $cropperConfiguration:  '@austral.entity_file.cropper.config'
      $image:                 '@austral.entity_file.image'

  austral.entity_file.uploader:
    alias:    Austral\EntityFileBundle\File\Upload\FileUploader
    public:   true

  Austral\EntityFileBundle\File\Download\FileDownloader:
    arguments:
      $mapping:               '@austral.entity.mapping'

  austral.entity_file.downloader:
    alias:    Austral\EntityFileBundle\File\Download\FileDownloader
    public:   true

  Austral\EntityFileBundle\File\Image\Image:
    arguments:
      $imagineLib:    '\Imagine\Gd\Imagine'
      $compression:   '@austral.entity_file.compression'

  austral.entity_file.image:
    alias:    Austral\EntityFileBundle\File\Image\Image
    public:   true

  Austral\EntityFileBundle\File\Image\ImageRender:
    arguments:
      $mapping:                 '@austral.entity.mapping'
      $imageLib:                '@austral.entity_file.image'
      $uploadsConfiguration:    '@austral.entity_file.uploads.config'
      $cropper:                 '@austral.entity_file.cropper'
      $compression:             '@austral.entity_file.compression'

  austral.entity_file.image.render:
    alias:    Austral\EntityFileBundle\File\Image\ImageRender
    public:   true

  Austral\EntityFileBundle\File\Link\Generator:
    arguments:
      $router:            '@router'
      $mapping:           '@austral.entity.mapping'
      $defaultLocale:     '%locale%'

  austral.entity_file.link.generator:
    alias:    Austral\EntityFileBundle\File\Link\Generator
    public:   true

  Austral\EntityFileBundle\File\Cropper\Cropper:
    arguments:
      $image:   '@austral.entity_file.image'
      $mapping: '@austral.entity.mapping'

  austral.entity_file.cropper:
    alias:        Austral\EntityFileBundle\File\Cropper\Cropper
    public:       true

  Austral\EntityFileBundle\File\Compression\Compression:
    arguments:
      $compressionConfiguration: '@austral.entity_file.compression.config'

  austral.entity_file.compression:
    alias:        Austral\EntityFileBundle\File\Compression\Compression
    public:       true

##### Twig Extension

  Austral\EntityFileBundle\TwigExtension\MediaTwig:
    class:        Austral\EntityFileBundle\TwigExtension\MediaTwig
    arguments:
      $generator:     '@austral.entity_file.link.generator'
      $mapping:       '@austral.entity.mapping'
    tags:
      - { name: twig.extension }

  twig.extension.media:
    alias:        Austral\EntityFileBundle\TwigExtension\MediaTwig
